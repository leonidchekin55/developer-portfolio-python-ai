name: Portfolio CI

on:
  push:
  pull_request:

jobs:
  pulseboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulseboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pulseboard-api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  knowledge-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knowledge-assistant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  knowledge-assistant-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: knowledge-assistant/web/package.json
      - run: npm install
      - run: npm run build
