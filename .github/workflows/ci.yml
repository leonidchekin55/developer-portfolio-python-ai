name: Portfolio CI

on:
  push:
  pull_request:

jobs:
  pulseboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulseboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pulseboard-api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  knowledge-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knowledge-assistant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  knowledge-assistant-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: knowledge-assistant/web/package.json
      - run: npm install
      - run: npm run build

  ai-engineer-portfolio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineer-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engineer-portfolio/pyproject.toml
      - run: pip install -e ".[test]" build
      - run: pytest -q
      - run: python -c "import main; print('application imports')"
      - run: python -m build --sdist --wheel
      - name: Verify distribution includes the eval dataset
        run: >-
          python -c "import glob, tarfile, zipfile;
          wheel=glob.glob('dist/*.whl')[0];
          sdist=glob.glob('dist/*.tar.gz')[0];
          assert 'apps/04_evals/dataset.json' in zipfile.ZipFile(wheel).namelist();
          assert 'sandbox.py' in zipfile.ZipFile(wheel).namelist();
          assert any(name.endswith('apps/04_evals/dataset.json') for name in tarfile.open(sdist).getnames());
          assert any(name.endswith('sandbox.py') for name in tarfile.open(sdist).getnames());
          print('wheel and sdist include eval dataset and public sandbox')"
      - run: docker build -t ai-engineer-portfolio .
