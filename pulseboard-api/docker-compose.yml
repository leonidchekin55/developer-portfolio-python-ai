services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: pulseboard, POSTGRES_PASSWORD: pulseboard, POSTGRES_DB: pulseboard}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U pulseboard"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"], interval: 10s, timeout: 5s, retries: 10}
  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes: ["./ops/grafana:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
volumes: {pgdata: {}}
