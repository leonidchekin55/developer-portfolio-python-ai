[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="pulseboard-api"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic-settings>=2.4,<3", "python-jose[cryptography]>=3.3,<4", "bcrypt>=4.2,<5", "python-multipart>=0.0.9", "redis>=5,<6", "celery>=5.4,<6", "prometheus-client>=0.20,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "pytest-asyncio>=0.24,<1"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
lint.ignore=["B008"]
