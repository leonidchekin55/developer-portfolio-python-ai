[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="knowledge-assistant"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy[asyncio]>=2,<3","asyncpg>=0.29,<1","aiosqlite>=0.20,<1","alembic>=1.13,<2","pydantic-settings>=2.4,<3","python-multipart>=0.0.9","pypdf>=5,<6","python-docx>=1.1,<2","qdrant-client>=1.11,<2","httpx>=0.27,<1","redis>=5,<6","celery>=5.4,<6"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
