services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: knowledge, POSTGRES_PASSWORD: knowledge, POSTGRES_DB: knowledge}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U knowledge"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    healthcheck: {test: ["CMD", "bash", "-c", "echo -n > /dev/tcp/localhost/6333"], interval: 10s, timeout: 3s, retries: 10}
  ollama:
    image: ollama/ollama:0.3.12
    volumes: [ollamadata:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull $${EMBED_MODEL:-nomic-embed-text}; ollama pull $${LLM_MODEL:-llama3.2:1b}; wait"]
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
  api:
    build: .
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@db:5432/knowledge, QDRANT_URL: http://qdrant:6333, OLLAMA_URL: http://ollama:11434, REDIS_URL: redis://redis:6379/0, UPLOAD_DIR: /data/uploads}
    ports: ["8001:8001"]
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, qdrant: {condition: service_healthy}, ollama: {condition: service_started}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"], interval: 10s, timeout: 5s, retries: 12}
  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment: {DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@db:5432/knowledge, QDRANT_URL: http://qdrant:6333, OLLAMA_URL: http://ollama:11434, REDIS_URL: redis://redis:6379/0, UPLOAD_DIR: /data/uploads}
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, qdrant: {condition: service_healthy}, ollama: {condition: service_started}}
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api]
volumes: {dbdata: {}, qdrantdata: {}, ollamadata: {}, uploads: {}}
