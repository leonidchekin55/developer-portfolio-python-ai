[project]
name = "ai-engineer-portfolio"
version = "0.1.0"
description = "Six local-first AI engineering portfolio demos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "python-multipart>=0.0.9",
  "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "prometheus-client>=0.21,<1", "mcp>=2,<3", "celery[redis]>=5.4,<6", "pgvector>=0.3,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "shared*"]
