services:
  - type: web
    name: leonid-ai-engineer-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /05-production/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/portfolio.db
      - key: UPLOAD_DIR
        value: /tmp/portfolio-uploads
      - key: LLM_MODE
        value: mock
      - key: EMBEDDING_MODE
        value: hash
      - key: CELERY_ENABLED
        value: "false"
      - key: API_TOKEN
        generateValue: true
      - key: READER_API_TOKEN
        generateValue: true
